<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulados das Provas 2026</title>
  <style>
    :root {
      --purple-primary: #5b21b6;   /* Roxo profundo */
      --purple-hover: #4c1d95;     /* Roxo para interações */
      --green-accent: #059669;     /* Verde esmeralda */
      --green-hover: #047857;      /* Verde escuro para hover */
      --bg-light: #f8fafc;         /* Fundo suavizado */
      --text-main: #1e293b;        /* Texto principal */
      --text-muted: #64748b;       /* Texto secundário */
      --card-border: #e2e8f0;      /* Borda sutil dos cards */
    }

    * {
      box-sizing: border-box;
      transition: all 0.25s ease;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      background-color: var(--bg-light);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho */
    header {
      background: linear-gradient(135deg, var(--purple-primary), #3b0764);
      color: white;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 12px rgba(91, 33, 182, 0.2);
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    /* Botão Voltar */
    .btn-voltar {
      background-color: var(--green-accent);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      display: none;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 2px 6px rgba(5, 150, 105, 0.3);
    }

    .btn-voltar:hover {
      background-color: var(--green-hover);
      transform: translateX(-2px);
    }

    .container {
      padding: 30px 20px;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    /* Grid de Matérias e Simulados */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    .card {
      background: white;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px 18px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--purple-primary);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(91, 33, 182, 0.12);
      border-color: rgba(91, 33, 182, 0.2);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card .icon {
      font-size: 2.2rem;
    }

    .card h3 {
      margin: 0;
      color: var(--purple-primary);
      font-size: 1.1rem;
      font-weight: 600;
    }

    .card p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Estilo para cards de simulados (Verde) */
    .card-simulado::before {
      background: var(--green-accent);
    }

    .card-simulado h3 {
      color: var(--green-accent);
    }

    .card-simulado:hover {
      box-shadow: 0 10px 20px rgba(5, 150, 105, 0.15);
      border-color: rgba(5, 150, 105, 0.3);
    }

    /* Moldura da Prova (iFrame) */
    .iframe-container {
      display: none;
      width: 100%;
      height: calc(100vh - 130px);
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--card-border);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <button id="btn-voltar" class="btn-voltar" onclick="voltar()">← Voltar</button>
    <h1 id="titulo-pagina">Simulados das Provas 2026</h1>
  </header>

  <div class="container">
    
    <!-- ETAPA 1: Lista de Todas as Matérias -->
    <div id="tela-materias" class="grid">
      <div class="card" onclick="abrirMateria('Fisiologia')">
        <span class="icon">🫀</span>
        <h3>Fisiologia</h3>
      </div>
      <div class="card" onclick="abrirMateria('Microbiologia')">
        <span class="icon">🧫</span>
        <h3>Microbiologia</h3>
      </div>
      <div class="card" onclick="abrirMateria('Parasitologia')">
        <span class="icon">🦠</span>
        <h3>Parasitologia</h3>
      </div>
      <div class="card" onclick="abrirMateria('Patologia')">
        <span class="icon">🔬</span>
        <h3>Patologia</h3>
      </div>
      <div class="card" onclick="abrirMateria('Imunologia')">
        <span class="icon">🛡️</span>
        <h3>Imunologia</h3>
      </div>
      <div class="card" onclick="abrirMateria('Vigilância em Saúde')">
        <span class="icon">🏥</span>
        <h3>Vigilância em Saúde</h3>
      </div>
      <div class="card" onclick="abrirMateria('Farmacologia')">
        <span class="icon">💊</span>
        <h3>Farmacologia</h3>
      </div>
      <div class="card" onclick="abrirMateria('Propedêutica')">
        <span class="icon">🩺</span>
        <h3>Propedêutica</h3>
      </div>
      <div class="card" onclick="abrirMateria('Psicomed')">
        <span class="icon">🧠</span>
        <h3>Psicomed</h3>
      </div>
    </div>

    <!-- ETAPA 2: Lista dos Simulados por Matéria -->
    <div id="lista-simulados" class="grid hidden"></div>

    <!-- ETAPA 3: Exibição da Prova Escolhida -->
    <div id="tela-iframe" class="iframe-container">
      <iframe id="iframe-simulado" src=""></iframe>
    </div>

  </div>

  <script>
    // Configuração dos simulados organizados por matéria
    const dadosSimulados = {
      "Parasitologia": [
        { nome: "Simulado 5", arquivo: "parasito 5.html" }
      ],
      "Microbiologia": [
        { nome: "Simulado TFCS", arquivo: "microtfcs.html" },
        { nome: "Simulado 2025", arquivo: "micro2025.html" },
        { nome: "Simulado 2023", arquivo: "micro2023.html" }
      ],
      "Fisiologia": [
        // Para adicionar simulados futuros, adicione linhas como essa:
        // { nome: "Simulado 1", arquivo: "fisio1.html" }
      ],
      "Patologia": [],
      "Imunologia": [],
      "Vigilância em Saúde": [],
      "Farmacologia": [],
      "Propedêutica": [],
      "Psicomed": []
    };

    let estadoAtual = 'materias';
    let materiaSelecionada = '';

    function abrirMateria(materia) {
      materiaSelecionada = materia;
      estadoAtual = 'simulados';
      
      document.getElementById('titulo-pagina').innerText = `Simulados de ${materia}`;
      document.getElementById('btn-voltar').style.display = 'block';
      document.getElementById('tela-materias').classList.add('hidden');
      
      const containerSimulados = document.getElementById('lista-simulados');
      containerSimulados.innerHTML = '';
      containerSimulados.classList.remove('hidden');

      const simuladosMateria = dadosSimulados[materia] || [];

      if (simuladosMateria.length === 0) {
        containerSimulados.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
            <p style="font-size: 1.1rem; margin-bottom: 8px;">Nenhum simulado disponível para esta matéria ainda.</p>
            <small>Adicione os arquivos no repositório do GitHub e vincule no script.</small>
          </div>
        `;
        return;
      }

      simuladosMateria.forEach(simulado => {
        const card = document.createElement('div');
        card.className = 'card card-simulado';
        card.innerHTML = `
          <span class="icon">📝</span>
          <h3>${simulado.nome}</h3>
          <p>Clique para iniciar a prova</p>
        `;
        card.onclick = () => carregarSimulado(encodeURIComponent(simulado.arquivo), simulado.nome);
        containerSimulados.appendChild(card);
      });
    }

    function carregarSimulado(arquivoHtml, nomeSimulado) {
      estadoAtual = 'prova';
      
      document.getElementById('titulo-pagina').innerText = `${materiaSelecionada} — ${nomeSimulado}`;
      document.getElementById('lista-simulados').classList.add('hidden');
      
      const iframeContainer = document.getElementById('tela-iframe');
      const iframe = document.getElementById('iframe-simulado');
      
      iframe.src = arquivoHtml;
      iframeContainer.style.display = 'block';
    }

    function voltar() {
      if (estadoAtual === 'prova') {
        document.getElementById('tela-iframe').style.display = 'none';
        document.getElementById('iframe-simulado').src = '';
        document.getElementById('lista-simulados').classList.remove('hidden');
        document.getElementById('titulo-pagina').innerText = `Simulados de ${materiaSelecionada}`;
        estadoAtual = 'simulados';
      } else if (estadoAtual === 'simulados') {
        document.getElementById('lista-simulados').classList.add('hidden');
        document.getElementById('tela-materias').classList.remove('hidden');
        document.getElementById('btn-voltar').style.display = 'none';
        document.getElementById('titulo-pagina').innerText = 'Simulados das Provas 2026';
        estadoAtual = 'materias';
      }
    }
  </script>
</body>
</html>
